name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Verify
        run: ./mvnw --batch-mode -Dspring.cloud.contract.skip=false verify

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  maven-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Show Maven Version
        run: mvn -v

      - name: Clean And Compile With System Maven
        run: mvn --batch-mode clean compile

      - name: Smoke Test Startup With System Maven
        run: |
          set +e
          timeout 120s mvn --batch-mode spring-boot:run > maven-smoke.log 2>&1
          exit_code=$?
          set -e

          cat maven-smoke.log

          if grep -Eq "password authentication failed|Connection refused|Unable to obtain isolated JDBC connection|Unable to determine Dialect without JDBC metadata" maven-smoke.log; then
            exit 0
          fi

          echo "A aplicacao nao falhou por causa do banco de dados."
          echo "Exit code: ${exit_code}"
          exit 1

      - name: Upload Maven Smoke Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-smoke-log
          path: maven-smoke.log

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Restore Dependency Check Data
        uses: actions/cache@v4
        with:
          path: target/dependency-check-data
          key: dependency-check-data-v13-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-data-v13-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        run: |
          unset NVD_API_KEY DLED_NVD_API_KEY
          NVD_API_KEY_VALUE="${{ secrets.NVD_API_KEY }}"

          MAVEN_ARGS=(--batch-mode -Psecurity-scan -DskipTests verify)
          if [ -n "${NVD_API_KEY_VALUE:-}" ]; then
            MAVEN_ARGS+=("-DnvdApiKey=${NVD_API_KEY_VALUE}")
          fi

          ./mvnw "${MAVEN_ARGS[@]}"

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json

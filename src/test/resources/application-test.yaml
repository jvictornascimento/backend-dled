api:
  prefix: /v1
security:
  api-key:
    header-name: X-API-Key
    value: test-api-key
cors:
  origin: http://localhost:8080
spring:
  datasource:
    url: jdbc:h2:mem:dled-test-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
server:
  port: 8081
cloudinary:
  cloud-name: test-cloud
  api-key: test-key
  api-secret: test-secret
  folder: test/products

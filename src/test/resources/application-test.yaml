api:
  prefix: /v1
security:
  jwt:
    secret: 0123456789012345678901234567890123456789012345678901234567890123
    expiration-minutes: 120
    cookie-name: AUTH_TOKEN
    cookie-secure: false
cors:
  origin: http://localhost:8080
spring:
  datasource:
    url: jdbc:h2:mem:dled-test-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
server:
  port: 8081
cloudinary:
  cloud-name: test-cloud
  api-key: test-key
  api-secret: test-secret
  folder: test/products

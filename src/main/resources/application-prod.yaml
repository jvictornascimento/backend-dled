security:
  api-key:
    keys:
      - id: ${API_KEY_PRIMARY_ID}
        hash: ${API_KEY_PRIMARY_HASH}
      - id: ${API_KEY_SECONDARY_ID:}
        hash: ${API_KEY_SECONDARY_HASH:}
  jwt:
    secret: ${JWT_SECRET}
    cookie-secure: true
  initial-admin:
    enabled: ${INITIAL_ADMIN_ENABLED:false}
  login-rate-limit:
    store: redis
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DBUSERNAME}
    password: ${DBPASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

api:
  prefix: /v1
security:
  jwt:
    secret: ${JWT_SECRET:0123456789012345678901234567890123456789012345678901234567890123}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    cookie-name: ${JWT_COOKIE_NAME:AUTH_TOKEN}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
cors:
  origin: http://localhost:8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
spring:
  application:
    name: dled-backend
  # DB Connection
  datasource:
    url: jdbc:postgresql://localhost:5432/${DBNAME}
    username: ${DBUSERNAME:postgres}
    password: ${DBPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
server:
  port: 8081
springdoc:
  swagger-ui:
    path: /swagger-ui.html
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:dled/products}

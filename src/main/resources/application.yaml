api:
  prefix: /v1
security:
  api-key:
    header-name: ${API_KEY_HEADER_NAME:X-API-Key}
    value: ${API_KEY_VALUE:test-api-key}
  jwt:
    secret: ${JWT_SECRET:0123456789012345678901234567890123456789012345678901234567890123}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    cookie-name: ${JWT_COOKIE_NAME:AUTH_TOKEN}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
  initial-admin:
    enabled: ${INITIAL_ADMIN_ENABLED:true}
    full-name: ${INITIAL_ADMIN_FULL_NAME:}
    username: ${INITIAL_ADMIN_USERNAME:}
    email: ${INITIAL_ADMIN_EMAIL:}
    phone: ${INITIAL_ADMIN_PHONE:}
    company-name: ${INITIAL_ADMIN_COMPANY_NAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}
cors:
  origin: http://localhost:8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
spring:
  application:
    name: dled-backend
  # DB Connection
  datasource:
    url: jdbc:postgresql://localhost:5432/${DBNAME}
    username: ${DBUSERNAME:postgres}
    password: ${DBPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate
server:
  port: 8081
springdoc:
  swagger-ui:
    path: /swagger-ui.html
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:dled/products}

api:
  prefix: /v1
security:
  api-key:
    header-name: ${API_KEY_HEADER_NAME:X-API-Key}
    value: ${API_KEY_VALUE:test-api-key}
  jwt:
    secret: ${JWT_SECRET:0123456789012345678901234567890123456789012345678901234567890123}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    cookie-name: ${JWT_COOKIE_NAME:AUTH_TOKEN}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
  initial-admin:
    enabled: ${INITIAL_ADMIN_ENABLED:true}
    full-name: ${INITIAL_ADMIN_FULL_NAME:}
    username: ${INITIAL_ADMIN_USERNAME:}
    email: ${INITIAL_ADMIN_EMAIL:}
    phone: ${INITIAL_ADMIN_PHONE:}
    company-name: ${INITIAL_ADMIN_COMPANY_NAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}
  login-rate-limit:
    store: ${LOGIN_RATE_LIMIT_STORE:memory}
    max-failed-attempts: ${LOGIN_RATE_LIMIT_MAX_FAILED_ATTEMPTS:5}
    block-minutes: ${LOGIN_RATE_LIMIT_BLOCK_MINUTES:15}
    failure-window-minutes: ${LOGIN_RATE_LIMIT_FAILURE_WINDOW_MINUTES:15}
cors:
  origin: ${CORS_ORIGIN:http://localhost:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
spring:
  application:
    name: dled-backend
  # DB Connection
  datasource:
    url: jdbc:postgresql://localhost:5432/${DBNAME}
    username: ${DBUSERNAME:postgres}
    password: ${DBPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:6MB}

  jpa:
    hibernate:
      ddl-auto: validate
server:
  port: 8081
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:dled/products}

services:
  postgres:
    image: postgres:16-alpine
    container_name: dled-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DBNAME:?Set DBNAME before starting the database}
      POSTGRES_USER: ${DBUSERNAME:?Set DBUSERNAME before starting the database}
      POSTGRES_PASSWORD: ${DBPASSWORD:?Set DBPASSWORD before starting the database}
    networks:
      - dled-db
    volumes:
      - dled-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBUSERNAME:?Set DBUSERNAME before starting the database} -d ${DBNAME:?Set DBNAME before starting the database}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dled-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - dled-db
    volumes:
      - dled-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dled-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DBNAME:?Set DBNAME before starting the app}
      DBNAME: ${DBNAME:?Set DBNAME before starting the app}
      DBUSERNAME: ${DBUSERNAME:?Set DBUSERNAME before starting the app}
      DBPASSWORD: ${DBPASSWORD:?Set DBPASSWORD before starting the app}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      LOGIN_RATE_LIMIT_STORE: redis
      LOGIN_RATE_LIMIT_MAX_FAILED_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_BLOCK_MINUTES: ${LOGIN_RATE_LIMIT_BLOCK_MINUTES:-15}
      LOGIN_RATE_LIMIT_FAILURE_WINDOW_MINUTES: ${LOGIN_RATE_LIMIT_FAILURE_WINDOW_MINUTES:-15}
      API_KEY_HEADER_NAME: X-API-Key
      API_KEY_VALUE: ${API_KEY_VALUE:?Set API_KEY_VALUE before starting the app}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the app}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      JWT_COOKIE_NAME: AUTH_TOKEN
      JWT_COOKIE_SECURE: "true"
      JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:-Lax}
      INITIAL_ADMIN_ENABLED: ${INITIAL_ADMIN_ENABLED:-false}
      INITIAL_ADMIN_FULL_NAME: ${INITIAL_ADMIN_FULL_NAME:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PHONE: ${INITIAL_ADMIN_PHONE:-}
      INITIAL_ADMIN_COMPANY_NAME: ${INITIAL_ADMIN_COMPANY_NAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?Set CLOUDINARY_CLOUD_NAME before starting the app}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?Set CLOUDINARY_API_KEY before starting the app}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?Set CLOUDINARY_API_SECRET before starting the app}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-dled/products}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN before starting the app}
      MAX_UPLOAD_FILE_SIZE: ${MAX_UPLOAD_FILE_SIZE:-5MB}
      MAX_UPLOAD_REQUEST_SIZE: ${MAX_UPLOAD_REQUEST_SIZE:-6MB}
    ports:
      - "8081:8081"
    networks:
      - dled-public
      - dled-db
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  dled-postgres-data:
  dled-redis-data:

networks:
  dled-public:
  dled-db:
    internal: true
